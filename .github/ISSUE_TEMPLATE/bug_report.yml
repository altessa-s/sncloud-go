name: Bug Report
description: Report a bug in sncloud-go
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: "go1.27.4 linux/amd64"
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: sncloud-go Version
      description: The version or commit SHA of sncloud-go you are using.
      placeholder: "v1.0.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package is affected?
      options:
        - (root) sncloud
        - internal/domain
        - internal/port
        - internal/app/channel
        - internal/app/session
        - internal/app/retry
        - internal/app/webfiles
        - internal/app/devicefiles
        - internal/app/transfers
        - internal/app/tasks
        - internal/app/digests
        - internal/app/feed
        - internal/adapter/httpapi
        - internal/adapter/ws
        - internal/adapter/neterr
        - internal/wiring
        - internal/porttest
        - internal/clouddouble
        - devtools
        - ci
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Create a ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages and stack traces if applicable.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
    validations:
      required: false
